{% extends "base.html" %}
{% block content %}

<h2>Delete Zeph</h2>

<p>Are you sure you want to delete this post?</p>

<div class="zeph-card">
    <p>{{ object.content }}</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'posts:detail' object.id %}">Cancel</a>
</form>

{% endblock %}
