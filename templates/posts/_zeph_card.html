<div class="zeph-card">


    <div class="avatar">
        {% if zeph.author.profile.avatar %}
        <img src="{{ zeph.author.profile.avatar.url }}" alt="{{ zeph.author.username }}"
            onerror="this.style.display='none'">
        {% endif %}
    </div>


    <div class="zeph-body">


        <div class="zeph-meta">
            <div class="meta-left">
                <div class="username">
                    {{ zeph.author.get_full_name|default:zeph.author.username }}
                </div>
                <div class="handle">@{{ zeph.author.username }}</div>
            </div>
            <div class="timestamp">{{ zeph.created_at|timesince }} ago</div>
        </div>


        <a href="{% url 'posts:detail' zeph.pk %}" class="zeph-link">
            <div class="zeph-text">{{ zeph.content|linebreaksbr }}</div>

            {% if zeph.image %}
            <div class="zeph-media">
                <img src="{{ zeph.image.url }}" class="zeph-image" alt="media">
            </div>
            {% endif %}
        </a>


        <div class="actions">

            <button class="action like-btn {% if zeph.is_liked_by_user %}liked{% endif %}"
                data-url="{% url 'engagements:like' zeph.id %}"
                aria-pressed="{% if zeph.is_liked_by_user %}true{% else %}false{% endif %}">
                <span class="heart">❤</span>
                <span class="count">{{ zeph.likes.count }}</span>
            </button>


            <button class="action bookmark-btn {% if zeph.is_bookmarked_by_user %}bookmarked{% endif %}"
                data-url="{% url 'engagements:bookmark' zeph.id %}"
                aria-pressed="{% if zeph.is_bookmarked_by_user %}true{% else %}false{% endif %}">
                <span class="bookmark-icon">🔖</span>
                <span class="count">{{ zeph.bookmarks.count }}</span>
            </button>

            {% if zeph.author == request.user %}
            <a class="action" href="{% url 'posts:edit' zeph.pk %}">Edit</a>
            <a class="action" href="{% url 'posts:delete' zeph.pk %}">Delete</a>
            {% endif %}
        </div>

    </div>
</div>
